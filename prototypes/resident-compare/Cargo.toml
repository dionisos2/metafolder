[package]
name = "metafolder-resident-compare"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone like the prototype it measures against (docs/spec-storage.org,
# "Acceptance criteria"): the resident engine, driven in-process through the
# daemon's own router, on the records of `metafolder_kv_proto::synth`.
[workspace]

[dependencies]
anyhow = "1"
axum = "0.7"
http-body-util = "0.1"
metafolder-core = { path = "../../crates/core" }
metafolder-daemon = { path = "../../crates/daemon" }
metafolder-kv-proto = { path = "../kvstore" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.4", features = ["util"] }
uuid = "1"

[profile.release]
debug = "line-tables-only"
