[package]
name = "metafolder-kv-proto"
version = "0.0.0"
edition = "2021"
publish = false

# A standalone workspace: the prototype is not a member of the main one
# (docs/spec-storage.org, increment 1 — it touches no daemon code).
[workspace]

[dependencies]
anyhow = "1"
heed = { version = "0.22", default-features = false }
libc = "0.2"
regex = "1"
roaring = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = "1"

[profile.release]
debug = "line-tables-only"

# The oracle test runs the naive reference over thousands of queries.
[profile.dev]
opt-level = 1
