[package]
name = "metafolder-bench"
version = "0.3.0"
edition = "2021"
publish = false

[[bin]]
name = "metafolder-bench"

[dependencies]
anyhow = "1"
metafolder-core = { path = "../core" }
# The regression suite generates its repositories through the daemon's own
# library: a `Writer` per revision builds a 5 000-revision log in seconds,
# where the same thing over HTTP takes minutes (spec-perf).
metafolder-daemon = { path = "../daemon" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
