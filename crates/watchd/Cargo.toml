[package]
name = "metafolder-watchd"
version = "0.3.0"
edition = "2021"
publish = false

# The privileged fanotify broker (docs/watcher-fanotify.md "The broker"): a
# library — the protocol, the permission filter and the fanotify reader, so the
# daemon links the protocol and tests can drive the server with synthetic
# events — plus the `metafolder-watchd` binary that wires them together.

[[bin]]
name = "metafolder-watchd"

[lib]
name = "metafolder_watchd"

[features]
# The simulated kernel (`sim`): the broker, unprivileged, for other crates'
# tests (the daemon's fanotify source).
sim = []

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
