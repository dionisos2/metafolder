[package]
name = "metafolder-query-oracle"
version = "0.3.0"
edition = "2021"
publish = false

# The SQL query engine, kept as the *oracle* the bitmap index is validated
# against (spec-indexing "It stays as the oracle"). It is a dev-dependency of
# the daemon and of nothing else, so it is never linked into a shipped binary:
# the daemon's own sources hold no query compiler, and therefore no path from
# the SQL layer to the tree cache.

[dependencies]
anyhow = "1"
metafolder-core = { path = "../core" }
metafolder-daemon = { path = "../daemon" }
regex = "1"
rusqlite = { version = "0.31", features = ["bundled", "functions"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
