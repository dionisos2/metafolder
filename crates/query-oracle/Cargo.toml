[package]
name = "metafolder-query-oracle"
version = "0.3.0"
edition = "2021"
publish = false

# The naive query oracle the daemon's evaluator is validated against
# (spec-indexing "It stays as the oracle"). A dev-dependency
# of the daemon and of nothing else, so it is never linked into a shipped
# binary.

[dependencies]
metafolder-core = { path = "../core" }
metafolder-daemon = { path = "../daemon" }
serde_json = "1"
uuid = "1"
