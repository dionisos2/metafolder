[package]
name = "metafolder-daemon"
version = "0.3.0"
edition = "2021"
publish = false

[[bin]]
name = "metafolder-daemon"

[dependencies]
anyhow = "1"
metafolder-core = { path = "../core" }
metafolder-watchd = { path = "../watchd" }
tokio = { version = "1", features = ["full"] }
axum = "0.7"
notify = "6"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
regex = "1"
# Companion to `regex`: parse a pattern to HIR to extract a required literal
# substring for the store's trigram pre-filter (doc "Text search in the store").
regex-syntax = "0.8"
base64 = "0.22"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Pure-Rust, magic-byte MIME detection for mfr_mime (no system libmagic).
infer = "0.19"
roaring = "0.10"
# The key-value storage backend (doc "Storage"): LMDB, a memory-mapped
# copy-on-write B+tree — the page cache is its cache.
heed = { version = "0.22", default-features = false }
# flock(2), for the one-daemon-per-repository lock the store takes itself.
libc = "0.2"
lofty = "0.25.0"
nom-exif = "3.6.2"

[dev-dependencies]
# The naive query oracle the evaluator is validated against
# (doc "The query oracle"). A dev-dependency cycle, which cargo
# allows: nothing but the tests links it.
metafolder-query-oracle = { path = "../query-oracle" }
# The broker over a simulated kernel (`sim`): the fanotify source driven
# without a privileged process (tests/common `Regime::Simulated`).
metafolder-watchd = { path = "../watchd", features = ["sim"] }
http-body-util = "0.1"
tower = { version = "0.4", features = ["util"] }
