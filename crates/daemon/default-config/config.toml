# Metafolder daemon settings (doc "Configuration"; doc "Daemon configuration").
# Installed into ~/.config/metafolder/daemon/ by metafolder-sync-config.
# The --config CLI flag overrides this path; a malformed file aborts startup.

# Repositories to auto-load when the daemon starts, as an array of tables
# (one [[load]] block per repo). Each entry has exactly one of `root` (the
# watched directory) or `metafolder` (an external .metafolder location) — same
# shape as a POST /repos/load body. A repo that fails to load is a warning, not
# a fatal error. With no [[load]] block (the default) the daemon auto-loads
# nothing; uncomment and adapt the example below to opt in. `in-memory = true`
# holds the repository's store in memory (doc "Holding a repository in memory").
#
# [[load]]
# root = "/home/user/music"
# in-memory = true
#
# [[load]]
# metafolder = "/ssd/meta/photos/.metafolder"

# Tunable UX/performance settings. Every key is optional: omit the whole
# [settings] table (or any key) to keep the default shown below.
[settings]

# Quiet period, in milliseconds, before the watcher's executor flushes the
# buffered filesystem events (it waits until no new event has arrived for this
# long, then compacts and applies them). Larger values batch more aggressively
# — fewer writes but more latency before changes show up; helpful on slow or
# network filesystems that emit bursts of events. Each flush is one write
# (per kind of change) in the log, so a short period splits one gesture — a
# save, a copy, an extraction — into many writes. Default: 2000.
watch-quiet-period-ms = 2000

# Percentage of the kernel's per-user inotify watch limit
# (fs.inotify.max_user_watches) that this daemon will spend. One watch is needed
# per watched directory — inotify has no recursive watch — and the limit is
# shared with every other program on the machine that watches files, so the
# daemon caps its own appetite rather than taking everything. Directories beyond
# the cap are marked mfr_watch_exceeded and are not watched live; they stay
# fully tracked, and `mf watch exceeded` reshapes the choice. Inert on macOS and
# Windows, whose backends watch a tree with one registration. Default: 50.
watch-budget-share = 50

# Where the fanotify broker is probed at load (doc "Watch sources and regimes";
# doc "The fanotify broker"). There is no watch-backend
# option: the socket is the switch. Reachable, and the daemon covers the whole
# tree through the broker — one kernel registration per mount, no
# per-directory watches, no watch budget; absent, and the daemon says so and
# watches with inotify (one watch per directory). A path where nothing listens
# is how one stays on inotify deliberately. Default: /run/metafolder/watchd.sock.
watchd-socket = "/run/metafolder/watchd.sock"

# Mass-orphan circuit breaker: the largest number of metarecords a single
# watcher batch may orphan (set mfr_path = Nothing) in one cascade. A batch that
# would null more than this is a filesystem going away — an unmount metafolder
# did not recognise, a disk unplugged — rather than a deletion the user asked
# for: the cascade is skipped, a warning is logged, and the metadata is left
# untouched (confirm a genuinely huge deletion with `mf orphan clear`, which
# re-checks every path against the disk). 0 disables the check. Default: 10000.
orphan-cascade-limit = 10000

# How many operations of the watcher the event log keeps. Every change the
# watcher sees under a watched tree is recorded, so a repository under an active
# watcher accumulates them for ever; past this many, the oldest fall off at the
# next write (the trim runs inside that write's own transaction — it costs less
# than the append that triggered it). It reclaims no disk space to the
# filesystem: the freed pages are reused by the next writes, so the database
# settles on a plateau instead of growing (use `mf log prune` for an actual
# VACUUM). Kept apart from your own operations below, so the watcher's churn
# never pushes your history out. 0 = unlimited. Default: 50000.
log-retention-watcher-ops = 50000

# How many of every other operation — your own changes, from the command line,
# the GUI or a script — the event log keeps. 0 = unlimited. Default: 1000000.
log-retention-user-ops = 1000000

# How long an operation must take, in milliseconds, before the daemon writes it
# to the repository's slow-operation log (.metafolder/internal/slow/, read with
# `mf slow`). An entry carries where the time went — the wait for the store
# handle, the query's preparation and evaluation, the commit — and how many
# keys each part read, not just the total, which is the part you already knew.
# Queries and field writes are occasionally seconds slow for reasons that are
# over by the time you notice, and this is what is left behind to explain
# them. 0 turns the log off; set it to 1 to record everything. Default: 1500.
slow-operation-threshold-ms = 1500

# The same, for an operation that wrote nothing — a query, a listing, a read of
# the log. What you wait for at every keystroke (the GUI's finder sends a query
# per key) is slow long before a write or a watcher flush is. 0: the threshold
# above. Default: 500.
slow-read-threshold-ms = 500

# How many keys an operation must read before it is logged however quick it
# was. A duration depends on the machine and its load; a count of keys does
# not, so this catches an operation that reads a large part of the repository
# on a machine fast enough to hide it. Every bounded read (a page, a folder, a
# search) stays far below the default. 0: time alone decides. Default: 100000.
slow-operation-reads-threshold = 100000

# Every how many days each loaded repository's automatic backup is taken: a
# consistent copy of its store, with its config, in
# .metafolder/internal/backups/auto/ (doc "Backups and restore"). One slot, replaced by the
# next backup — and only by one that checks clean, so a store damaged since
# keeps the last good backup (a warning in the repository's diagnostics says
# so). The daemon looks when it starts and then every hour; the copy holds the
# repository for as long as it takes. Costs about the store's size once more on
# disk. `mf repo backup` takes one by hand. 0 turns it off. Default: 7.
auto-backup-days = 7

# Where the store of a repository held in memory (`mf repo load --in-memory`)
# is copied: a directory in RAM, a tmpfs. The copy takes the store's size there
# for as long as the repository is held; a daemon starting removes the copies a
# crash left. Default: /dev/shm/metafolder-<uid>.
# memory-dir = "/dev/shm/metafolder-1000"
