[package]
name = "metafolder-core"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# The repository trash index is a small dedicated key-value store (LMDB, the
# daemon's store); the blobs stay on disk.
heed = { version = "0.23", default-features = false }
# The `mf sync` intents file (doc "The intents file") is TOML; parsing lives in core so the
# CLI and GUI share it.
toml = "1.0"
# Only the programs that apply configuration link libgit2 (the config-sync
# command, and `mf`/the GUI for a repository's own configuration); reading
# configuration never does, and the daemon never links it.
git2 = { version = "0.21", default-features = false, optional = true }

[features]
# The git-backed modules: `config_sync` and `repo_config` (doc "Repository
# configuration"), and `repo_init`, which installs the latter.
git = ["dep:git2"]
# Enables the `metafolder-sync-config` binary.
sync-config = ["git"]

[[bin]]
name = "metafolder-sync-config"
required-features = ["sync-config"]

[lints]
workspace = true
