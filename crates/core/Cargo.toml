[package]
name = "metafolder-core"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# The repository trash index is a small dedicated key-value store (LMDB, the
# daemon's store); the blobs stay on disk.
heed = { version = "0.22", default-features = false }
# The `mf sync` intents file (spec-sync) is TOML; parsing lives in core so the
# CLI and GUI share it.
toml = "1.0"
# Only the config-sync command links libgit2; reading configuration never does.
git2 = { version = "0.19", default-features = false, optional = true }

[features]
# Enables the `metafolder-sync-config` binary and its git-backed sync module.
sync-config = ["dep:git2"]

[[bin]]
name = "metafolder-sync-config"
required-features = ["sync-config"]
