[package]
name = "metafolder-cli"
version = "0.3.0"
edition = "2021"
publish = false

# The CLI binary is named `mf` (doc "Command line").
[[bin]]
name = "mf"
path = "src/main.rs"

[dependencies]
metafolder-core = { path = "../core", features = ["git"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ureq = { version = "3", default-features = false, features = ["json"] }
# Reading the GUI's config.toml to discover its port (doc "mf gui").
toml = "1.0"

# The local time zone `mf slow` shows its times in (doc "mf slow list");
# already built for the daemon (nom-exif), with the same features.
chrono = "0.4"

[dev-dependencies]
metafolder-daemon = { path = "../daemon" }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
heed = { version = "0.23", default-features = false }
