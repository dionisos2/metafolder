"{panel} {keep}" = { command = "duplicates:keep", when = "duplicates" }
"{panel} {list}" = { command = "path-ref:list-refs {target}", target = "other", when = "path-ref" }

"ctrl+n" = [
  { command = "metarecord:create", when = "metarecord-detail" },
  { command = "metarecord:create", when = "metarecord-list" },
  { command = "path-ref:add", when = "path-ref" },
  { command = "file:new self file", when = "file-manager" },
]
"ctrl+shift+n" = { command = "file:new self folder", when = "file-manager" }
"f2" = { command = "file:rename self" }
"ctrl+h" = { command = "file-manager:toggle hidden", when = "file-manager" }

"{view} g" = { command = "metarecord-list:toggle mode", when = "metarecord-list" }
