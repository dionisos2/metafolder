"{item} {item} {delete}" = { command = "item:delete selection" }
"{item} {query-verb} {delete}" = { command = "item:delete query" }
# The slideshow (doc "Slideshow"): the checked files, or the query's.
"shift+{item} {run}" = { command = "viewer:play selection" }
"{item} {item} {run}" = { command = "viewer:play selection" }
"{item} {query-verb} {run}" = { command = "viewer:play query" }

# ── Tags (,) ─────────────────────────────────────────────────────────────────

"{tags} {add}" = { command = "tag:add tag" }
"{tags} {remove}" = { command = "tag:remove tag" }
"{tags} {query-verb}" = { command = "tag:query tag" }
"{tags} - {add}" = { command = "tag:add negative_tag" }
"{tags} - {remove}" = { command = "tag:remove negative_tag" }
"{tags} - {query-verb}" = { command = "tag:query negative_tag" }
"{tags} = {add}" = { command = "tag:add mixed_tag" }
"{tags} = {remove}" = { command = "tag:remove mixed_tag" }
"{tags} = {query-verb}" = { command = "tag:query mixed_tag" }
