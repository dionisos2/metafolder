# The keybindings of the metafolder GUI (doc "Keybindings"). Installed as
# ~/.config/metafolder/gui/keybindings.toml, this file IS the complete set —
# the shipped keys and your changes, merged by git — so edit it in place
# (doc "Changing keybindings").
#
# Format: each key is a combo (or a whitespace-separated sequence like "g r").
# Its value is either a single binding table, or — when the same combo maps to
# a different command depending on the focused panel — an ARRAY of bindings,
# each scoped with `when = "<panel-type>"`. `text-input = true` lets a binding
# fire even while a text input is focused; `focus = "<name>"` restricts it to
# one named text field. A binding with no `when` is global.
#
# How the keys are chosen (doc "Choosing keybindings"):
# - a key is a character, typed the same on bépo, AZERTY and QWERTY: letters,
#   `, - =`, named keys; never AltGr, a dead key or an accented letter;
# - a single letter is for what is done all the time (`x` command input, `o`
#   other panel, `f` find); every other letter starts a domain (`g` go to,
#   `v` view, `p` the panel's actions, `m` metarecords, `,` tags…), and the
#   second letter is a verb from one table (a add, s set, r remove, u unset…);
# - the shortcuts every program has (ctrl+c, ctrl+z, F5…) are kept as well;
# - what cannot be undone has no key.
#
# Variables (doc "Keybinding variables"): a letter with a role is named once
# below, and `{name}` in a key stands for it. A command holding `{target}`
# stands for four keys: its own, aimed at its default `target`, and the same
# under the prefixes `i` (here), `b` (the other slot, beside) and `n` (a new
# workspace).

# ── Variables ────────────────────────────────────────────────────────────────

# Targets: where what opens goes.
vars.target-here = "i"
vars.target-other = "b"
vars.target-new = "n"
# Domains of nouns.
vars.go = "g"
vars.view = "v"
vars.panels = "t"
vars.help = "h"
vars.workspaces = "w"
vars.clipboard = "c"
# Domains of verbs: the focused panel's actions, the selected metarecord, the
# items (a file, or a metarecord), tags. Under `record` and `item`, shift or the
# letter doubled means the checked ones, and `query-verb` the list's query.
vars.panel = "p"
vars.record = "m"
vars.item = "e"
vars.tags = ","
# Verbs (second position); shift is a variant of the same verb.
vars.add = "a"
vars.set = "s"
vars.remove = "r"
vars.unset = "u"
vars.edit = "e"
vars.rename = "n"
vars.retype = "t"
vars.delete = "d"
vars.create = "c"
vars.query-verb = "q"
vars.open = "o"
vars.list = "l"
vars.run = "p"
vars.revert = "z"
vars.keep = "k"
vars.index = "i"

# ── Everywhere ───────────────────────────────────────────────────────────────

# The command input (doc "The command input"): `x`, shift+x to start from an
# empty line; `:` is the same as `x`, for whoever has it without shift, and `!`
# a bash line.
"x" = { command = "command-input:focus command" }
":" = { command = "command-input:focus command" }
"shift+x" = { command = "command-input:focus command clear" }
"!" = { command = "command-input:focus bash" }

# The other panel; F6 walks the panels and a script's question (doc "Script
# sessions"), whose keys it takes and gives back. Tab is left to the panels.
"o" = { command = "panel:focus next" }
"f6" = { command = "panel:focus cycle" }

# Macros (doc "Macros"), on Emacs's keys.
"f3" = { command = "macro:toggle-recording" }
"f4" = { command = "macro:run" }
"ctrl+g" = { command = "macro:ask", text-input = true }

# Text editing, while typing too.
"escape" = [
  { command = "editing:unfocus", text-input = true },
  { command = "find:close", focus = "find" },
]
"ctrl+u" = { command = "editing:discard", text-input = true }
"ctrl+e" = { command = "editing:goto line-end", text-input = true }
"ctrl+k" = { command = "editing:clear-line-end", text-input = true }
# Ctrl+A goes to the start of the line while typing, and checks every row of
# a list otherwise; Ctrl+Shift+A unchecks them.
"ctrl+a" = [
  { command = "editing:goto line-start", text-input = true },
  { command = "metarecord-list:select all", when = "metarecord-list" },
  { command = "file-manager:select all", when = "file-manager" },
]
"ctrl+shift+a" = [
  { command = "metarecord-list:select none", when = "metarecord-list" },
  { command = "file-manager:select none", when = "file-manager" },
]

# Completion views (doc "Completion views"): next, previous.
"ctrl+," = { command = "completion:cycle forward", text-input = true }
"ctrl+-" = { command = "completion:cycle back", text-input = true }

# The status bar's message; in the shell, its output.
"ctrl+l" = [
  { command = "status:clear", text-input = true },
  { command = "shell:clear", when = "shell" },
]

# Find in a panel (doc "Find in a panel").
"ctrl+f" = { command = "find:open", text-input = true }

# The conventions of every program. Ctrl+R refreshes; in a text field it stays
# the input history's (doc "Input history").
"ctrl+q" = { command = "quit", text-input = true }
"f5" = [
  { command = "view:refresh self" },
  { command = "sync:status", when = "sync" },
]
"ctrl+r" = [
  { command = "view:refresh self" },
  { command = "sync:status", when = "sync" },
]
"ctrl+z" = { command = "log:undo" }
"ctrl+shift+z" = { command = "log:redo" }
"ctrl+y" = { command = "log:redo" }
"f11" = { command = "panel:toggle fullscreen" }
"f12" = { command = "devtools:open" }
"ctrl+enter" = [
  { command = "pick:confirm" },
  { command = "pick:confirm", focus = "finder" },
]
"ctrl+escape" = { command = "pick:cancel" }

# Zoom: `=` in (typed without shift everywhere, `plus` too), `-` out, `0` back.
"=" = [
  { command = "view:zoom self in" },
  { command = "viewer:zoom in", when = "viewer" },
]
"plus" = [
  { command = "view:zoom self in" },
  { command = "viewer:zoom in", when = "viewer" },
]
"-" = [
  { command = "view:zoom self out" },
  { command = "viewer:zoom out", when = "viewer" },
]
"0" = [
  { command = "view:zoom self reset" },
  { command = "viewer:zoom reset", when = "viewer" },
]

# The file clipboard (doc "Global GUI variables"): the usual keys, and `c`.
"ctrl+c" = { command = "clipboard:copy self" }
"ctrl+x" = { command = "clipboard:cut self" }
"ctrl+v" = { command = "clipboard:paste self" }
"{clipboard} c" = { command = "clipboard:copy self" }
"{clipboard} x" = { command = "clipboard:cut self" }
"{clipboard} v" = { command = "clipboard:paste self" }
"{clipboard} {unset}" = { command = "clipboard:clear" }

# ── Workspaces ───────────────────────────────────────────────────────────────

"1" = { command = "workspace:goto 1" }
"2" = { command = "workspace:goto 2" }
"3" = { command = "workspace:goto 3" }
"4" = { command = "workspace:goto 4" }
"5" = { command = "workspace:goto 5" }
"6" = { command = "workspace:goto 6" }
"7" = { command = "workspace:goto 7" }
"8" = { command = "workspace:goto 8" }
"9" = { command = "workspace:goto 9" }
"ctrl+tab" = { command = "workspace:next" }
"ctrl+pagedown" = { command = "workspace:next" }
"ctrl+shift+tab" = { command = "workspace:prev" }
"ctrl+pageup" = { command = "workspace:prev" }
"ctrl+t" = { command = "workspace:new" }
"ctrl+w" = { command = "workspace:close" }
"ctrl+s" = [
  { command = "workspace:save" },
  { command = "viewer:save", focus = "viewer-text", text-input = true },
]
"ctrl+o" = { command = "workspace:open here" }
# Ctrl+D duplicates the workspace.
"ctrl+d" = { command = "workspace:fork" }
"{workspaces} {create}" = { command = "workspace:new" }
"{workspaces} {open}" = { command = "workspace:open here" }
"{target-new} {workspaces} {open}" = { command = "workspace:open new" }
"{workspaces} {rename}" = { command = "workspace:rename" }
"{workspaces} {delete}" = { command = "workspace:delete-saved" }

# ── Panels and their layout (v: view) ────────────────────────────────────────

"{view} v" = { command = "panel:toggle split" }
"{view} f" = { command = "panel:toggle fullscreen" }
"{view} x" = { command = "panel:swap" }

# t then a letter: a panel type, here by default.
"{panels} l" = { command = "panel:open {target} metarecord-list", target = "here" }
"{panels} d" = { command = "panel:open {target} metarecord-detail", target = "here" }
"{panels} f" = { command = "panel:open {target} viewer", target = "here" }
"{panels} m" = { command = "panel:open {target} file-manager", target = "here" }
"{panels} o" = { command = "panel:open {target} log", target = "here" }
"{panels} r" = { command = "panel:open {target} repos", target = "here" }
"{panels} g" = { command = "panel:open {target} message", target = "here" }
"{panels} s" = { command = "panel:open {target} shell", target = "here" }
"{panels} w" = { command = "panel:open {target} workspace-info", target = "here" }
"{panels} t" = { command = "panel:open {target} path-ref", target = "here" }
"{panels} b" = { command = "panel:open {target} trash", target = "here" }
"{panels} y" = { command = "panel:open {target} sync", target = "here" }
"{panels} h" = { command = "panel:open {target} help", target = "here" }
"{panels} v" = { command = "panel:open {target} recent", target = "here" }
"{panels} u" = { command = "panel:open {target} duplicates", target = "here" }
"{panels} c" = { command = "panel:open {target} config", target = "here" }
"{panels} k k" = { command = "panel:open {target} keybindings", target = "here" }
"{panels} k v" = { command = "panel:open {target} keybindings-variables", target = "here" }

# ── Rows: the cursor in every panel with rows (doc "Generic panel commands"),
# and opening one (doc "Opening a row") ───────────────────────────────────────

# Enter confirms what is typed, and on a row opens it: from a row, beside it
# by default — i / b / n Enter here, beside, in a new workspace.
"enter" = [
  { command = "editing:confirm", text-input = true },
  { command = "find:next", focus = "find" },
  { command = "metarecord-list:apply finder", focus = "finder" },
  { command = "help:apply search", focus = "search" },
  { command = "panel:open other viewer", when = "metarecord-list" },
  { command = "panel:open other viewer", when = "recent" },
  { command = "file-manager:activate {target}", target = "other", when = "file-manager" },
  { command = "duplicates:activate {target}", target = "other", when = "duplicates" },
  { command = "cursor:descend self", when = "help" },
  { command = "cursor:descend self", when = "log" },
  { command = "cursor:descend self", when = "path-ref" },
  { command = "metarecord:row-edit", when = "metarecord-detail" },
  { command = "trash:restore", when = "trash" },
]
"shift+enter" = [
  { command = "find:prev", focus = "find" },
  { command = "metarecord-list:apply finder stay", focus = "finder" },
  { command = "help:apply search stay", focus = "search" },
  { command = "panel:open other metarecord-detail", when = "metarecord-list" },
  { command = "panel:open other metarecord-detail", when = "recent" },
  { command = "panel:open other metarecord-detail", when = "file-manager" },
  { command = "panel:open other metarecord-detail", when = "duplicates" },
  { command = "panel:open other metarecord-detail", when = "path-ref" },
]
"down" = [
  { command = "cursor:next self" },
  { command = "cursor:next metarecord-list", when = "viewer" },
  { command = "cursor:next metarecord-list", focus = "finder" },
]
"up" = [
  { command = "cursor:prev self" },
  { command = "cursor:prev metarecord-list", when = "viewer" },
  { command = "cursor:prev metarecord-list", focus = "finder" },
]
"home" = [
  { command = "cursor:first self" },
  { command = "cursor:first metarecord-list", when = "viewer" },
]
"end" = [
  { command = "cursor:last self" },
  { command = "cursor:last metarecord-list", when = "viewer" },
]
"left" = [
  { command = "cursor:parent self" },
  { command = "metarecord:back", when = "metarecord-detail" },
  { command = "viewer:seek -10", when = "viewer" },
]
"right" = [
  { command = "cursor:descend self" },
  { command = "panel:open other viewer", when = "metarecord-list" },
  { command = "panel:open other viewer", when = "recent" },
  { command = "duplicates:toggle-group", when = "duplicates" },
  { command = "viewer:seek +10", when = "viewer" },
]
"backspace" = [
  { command = "cursor:parent self" },
  { command = "metarecord:back", when = "metarecord-detail" },
  { command = "help:back", when = "help" },
  { command = "viewer:back", when = "viewer" },
]
"shift+backspace" = [
  { command = "help:forward", when = "help" },
  { command = "viewer:speed reset", when = "viewer" },
]
"alt+up" = [
  { command = "cursor:parent self" },
  { command = "metarecord-list:order move up", when = "metarecord-list" },
]
"alt+down" = { command = "metarecord-list:order move down", when = "metarecord-list" }
"alt+home" = { command = "cursor:root self" }
"alt+left" = [
  { command = "metarecord:back", when = "metarecord-detail" },
  { command = "help:back", when = "help" },
]
"alt+right" = { command = "help:forward", when = "help" }

# Find: `f` a row by its name, shift+f walking down into it; `/` as in most
# programs. In the list, `f` is its finder field, and shift+f empties it.
"f" = [
  { command = "cursor:find self select" },
  { command = "metarecord-list:focus finder", when = "metarecord-list" },
]
"/" = [
  { command = "cursor:find self select" },
  { command = "metarecord-list:focus finder", when = "metarecord-list" },
]
"shift+f" = [
  { command = "cursor:find self walk" },
  { command = "metarecord-list:focus finder clear", when = "metarecord-list" },
]

# Space toggles in place: check a row, play or pause.
"space" = [
  { command = "metarecord-list:select toggle", when = "metarecord-list" },
  { command = "file-manager:select toggle", when = "file-manager" },
  { command = "viewer:play-pause", when = "viewer" },
]

# ── Go to (g): a picker, so here by default ──────────────────────────────────

"{go} r" = { command = "recent {target} time", target = "here" }
"{go} shift+r" = { command = "recent {target} score", target = "here" }
"{go} d" = { command = "folder:open files {target}", target = "here" }
"{go} l" = { command = "folder:open children {target}", target = "here" }
"{go} shift+l" = { command = "folder:open subtree {target}", target = "here" }
"{go} o" = { command = "repos:switch" }
"{go} shift+o" = { command = "repos:load on-disk" }
"{go} p" = { command = "script:run" }
"{go} w" = { command = "file:open-with" }
"{go} m" = { command = "file-manager:reveal {target}", target = "here" }
# The selection's folder as a list: from a row, so beside it.
"{go} s" = { command = "metarecord-list:folder {target}", target = "other" }

# ── Help (h) ─────────────────────────────────────────────────────────────────

"{help} h" = { command = "help:open" }
"{help} c" = { command = "help:cursor" }
"f1" = { command = "help:cursor", text-input = true }
"{help} k" = { command = "help:key" }
"{help} x" = { command = "help:command" }

# ── The focused panel's actions (p) and what it shows (v) ────────────────────

# Its text fields: edit, or edit from empty (shift).
"{panel} {set}" = { command = "viewer:save", when = "viewer" }
"{panel} {edit}" = [
  { command = "viewer:focus text", when = "viewer" },
  { command = "metarecord-list:focus simplified", when = "metarecord-list" },
  { command = "help:focus search", when = "help" },
  { command = "shell:focus line", when = "shell" },
  { command = "keybindings:focus key", when = "keybindings" },
  { command = "config:focus filter", when = "config" },
  { command = "keybindings-variables:focus filter", when = "keybindings-variables" },
]
"{panel} shift+{edit}" = [
  { command = "metarecord-list:focus simplified clear", when = "metarecord-list" },
  { command = "help:focus search clear", when = "help" },
]
"{panel} {query-verb}" = { command = "metarecord-list:focus normal", when = "metarecord-list" }
"{panel} shift+{query-verb}" = { command = "metarecord-list:focus normal clear", when = "metarecord-list" }
"{panel} {unset}" = { command = "metarecord-list:clear-all", when = "metarecord-list" }
"{panel} {open}" = [
  { command = "help:open-hints", when = "help" },
  { command = "sync:plan", when = "sync" },
]
