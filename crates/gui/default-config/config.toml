# Metafolder GUI settings (doc "Configuration"; doc "Connection to the daemon").
# Installed into ~/.config/metafolder/gui/ by metafolder-sync-config.
# CLI flags (--daemon-port / --gui-port) override these at launch.

# Port of the daemon the GUI connects to (on 127.0.0.1, the only address the
# daemon listens on). Defaults to the daemon's own default port, so the GUI
# connects out of the box without any flag.
daemon-port = 7523

# Port the GUI's own HTTP server (panel assets + scripting API) binds. The
# `mf gui` CLI reads this same value to reach the GUI (no gui.port file).
gui-port = 7524

# External programs offered by `file:open-with` ("g w", and "Open with…" in the
# right-click menu of any file row) to open the selected file or folder. These
# are completion candidates, not a whitelist: the prompt accepts any command
# line, and the whole line is run verbatim with the selected paths appended
# (so entries may carry flags, e.g. "gimp -n"). Output goes to the message
# panel, exactly like a `!` command. Defaults to the desktop's own handler.
open-with = ["xdg-open"]
# open-with = ["xdg-open", "mpv", "gimp", "libreoffice", "gimp -n"]

# Progressive list loading: how many rows/tiles each list panel renders per
# window before more are fetched/revealed on scroll (a footer shows
# "loaded/total"). Smallest for metarecord-list (each row needs several daemon
# round-trips and parsing), largest for file-manager (a plain text row is the
# cheapest to build); file sits in between (each tile is a lazy <img>).
# treeref is keyed by its panel-type name too.
[page-size]
metarecord-list = 100
file = 150
file-manager = 200
treeref = 200

# Miscellaneous runtime settings. Every key is optional: omit the table (or any
# key) to keep the default shown below.
[settings]

# How often (seconds) the GUI polls the daemon's health endpoint (drives the
# connection indicator). Default: 5.
daemon-health-poll-secs = 5

# How often (milliseconds) a running reconcile polls its task for completion.
# Default: 200.
reconcile-poll-ms = 200

# How long (seconds) the thumbnail server reuses the fetched repository list
# before re-querying the daemon — keeps a thumbnail grid from hitting GET /repos
# once per tile. Default: 3.
repo-list-cache-ttl-secs = 3

# How long (milliseconds) a call to the daemon must take before the GUI writes
# it to the repository's slow-operation log (.metafolder/internal/slow/, read
# with `mf slow`). This records what *you* waited for; the daemon separately
# records what it spent, and the two entries carry the same op-id — a 5 s wait
# against a 200 ms daemon entry says the time went to the client, not the
# daemon. 0 turns the GUI's side of the log off. Default: 2000.
slow-operation-threshold-ms = 2000

# Shared panel UX timing knobs, handed to every panel. Every key optional.
[panels]

# Durations (ms) the panels attach to a status message, ordinary and error.
# Without effect: a status message stays until the next one replaces it (or
# `status:clear`), so these no longer hide anything. Defaults: 5000, 8000.
status-message-ms = 5000
status-error-ms = 8000

# Debounce (ms) of the incremental finder filter in metarecord-list: a burst of
# typing sends one query rather than one per keystroke. Default: 500.
finder-debounce-ms = 500

# Debounce (ms) of the live edit preview in metarecord-list. Default: 130.
live-preview-debounce-ms = 130

# Interval (ms) at which the repos panel polls running task status. Default:
# 1500.
task-poll-ms = 1500

# Ref value seeds (doc "Ref value seeds"). A `ref` field points to a
# metarecord by uuid, which is unreadable to type by hand — so a rule here says
# how its targets are *named* everywhere a value is typed or shown: which
# metarecords may be named (a `metarecord-list` query, optional — the picker
# opens on it too) and how each is shown (its columns syntax, the same
# vocabulary a list cell is built with). A value is then entered as that label
# (e.g. `animals/cats`), and a 32-char hex uuid is always accepted directly.
#
# Written `"columns"` or `["query", "columns"]`. The `*` entry is the default
# rule, read for every field that names none. The tag model's three ref fields
# point at their `path` hierarchy; everything else falls to `*`, which names by
# the columns a list would show.
[ref-seeds]
tag          = ['mf_schema = "tag"', 'path:path']
negative_tag = ['mf_schema = "tag"', 'path:path']
mixed_tag    = ['mf_schema = "tag"', 'path:path']
# author       = ['mf_schema = "person"', 'full_name:name']
'*'          = 'path:path mfr_path:path name label'

# Completion-wide knobs (doc "Completion views"). The separator joins the
# columns of a multi-column label — the label is typed back whole, so the join
# must be deterministic and typeable. Default: " | ".
[completion]
label-separator = ' | '

# Per-panel-type default values (doc "GUI configuration"). Each table is
# handed verbatim to the panel of that name as `metafolder.defaults` (keys
# camelCased: `text-preview-limit` reads as `metafolder.defaults.textPreviewLimit`),
# so a custom panel type gets its own table the same way — the GUI knows
# nothing about the keys. Omit a key (or the whole table) and the panel falls
# back to the built-in value shown below. These are *initial* values: where a
# panel persists the setting per workspace (columns, finder fields, the treeref
# field), the stored workspace value still wins.

[panel-defaults.metarecord-list]
# Columns of the table mode, in the columns input's own syntax.
columns = "mfr_path:path mfr_type &version order_file"
# Fields the finder (quick OSM filter) searches, each with an explicit mode
# (`field:path` for a tree_ref's assembled path, `field:value` for a plain
# value); a bare `field` auto-detects from the field catalog. A missing field
# contributes nothing, so listing one that only some repos have is safe.
finder-fields = ["mfr_path:path", "label:value", "name:value"]
# The column shown as each tile's name in grid mode.
grid-name-column = "mfr_path:path"

[panel-defaults.treeref]
# The tree_ref field whose forest the panel opens on.
field = "mfr_path"
# The Ref field the "what points at this node?" query follows back into the
# forest (`treeref:list-refs`). Tags are by far the common case.
ref-field = "tag"

[panel-defaults.file]
# Whether a file is an image, a video, an audio file or a PDF is read from its
# content, not from its name: there is no extension list for those. Text has no
# signature to read, hence the one list below.
#
# Known text extensions: a *fast path* to the text preview, not the only way in
# (any other extension is decided by sniffing the bytes), and the way a file
# whose encoding the sniff rejects (UTF-16 holds NULs) still previews. Add an
# extension here rather than expecting the sniff to cover it.
text-extensions = [
  "txt", "md", "org", "json", "toml", "yaml", "yml", "xml", "html", "css", "js", "ts",
  "rs", "py", "sh", "c", "h", "cpp", "java", "log", "csv", "ini", "conf",
]
# Resolution a PDF page is rendered at, in DPI (the pages are images rendered
# by poppler, out of process — the file itself is never loaded into the
# WebView). 150 is a readable A4 page;
# raise it for a sharper zoom at the cost of a bigger image and a slower render.
document-dpi = 150
# Bytes of a text file read into the preview (the rest is elided). Default: 256 KiB.
text-preview-limit = 262144
# Image zoom: a step multiplies the current scale; the bounds keep the manual
# size sane.
zoom-step = 1.25
zoom-min = 0.05
zoom-max = 40
