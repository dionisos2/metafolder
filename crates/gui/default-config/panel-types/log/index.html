<!doctype html>
<!-- Built-in panel type: event log — a tree of labels and operations, and
     what an operation changed (doc "log panel"). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>log</title>
    <style>
      [hidden] {
        display: none !important;
      }
      .mf-panel-body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100%;
        font-size: 13px;
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 4px 8px;
        background: var(--mf-bg-raised, #26262e);
        align-items: center;
      }
      button {
        font: inherit;
        background: var(--mf-bg, #1e1e24);
        color: var(--mf-fg, #d8d8e0);
        border: 1px solid var(--mf-fg-dim, #8a8a96);
        border-radius: 3px;
        padding: 1px 8px;
        cursor: pointer;
      }
      /* The list scrolls inside the panel — scrollbar and wheel — instead of
         overflowing it; min-height lets a flex child shrink below its
         content. */
      #revisions {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        position: sticky;
        top: 0;
        text-align: left;
        background: var(--mf-bg-raised, #26262e);
        padding: 4px 8px;
      }
      td {
        padding: 3px 8px;
        white-space: nowrap;
      }
      th.open-col,
      td.open-cell {
        width: 1.8em;
        padding: 0 0 0 4px;
      }
      #breadcrumb {
        padding: 3px 8px;
        color: var(--mf-fg-dim, #8a8a96);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #breadcrumb .crumb {
        cursor: pointer;
      }
      #breadcrumb .crumb:hover {
        color: var(--mf-fg, #fff);
        text-decoration: underline;
      }
      tr.rev {
        cursor: pointer;
      }
      tr.rev:hover,
      tr.rev.selected {
        background: var(--mf-bg-raised, #26262e);
      }
      tr.ops {
        cursor: pointer;
      }
      tr.ops td {
        padding: 1px 8px;
      }
      tr.ops:hover,
      tr.ops.selected {
        background: var(--mf-bg-raised, #26262e);
      }
      .op {
        font-family: var(--mf-font-mono, monospace);
        font-size: 0.9em;
        color: var(--mf-fg-dim, #8a8a96);
      }
      /* What a revision is, at a glance: whose write it was, whether it is
         itself an undo, and whether it has already been undone. */
      .badge {
        font-size: 0.85em;
        border: 1px solid currentColor;
        border-radius: 3px;
        padding: 0 4px;
        margin-right: 4px;
        white-space: nowrap;
      }
      .badge.watcher {
        color: var(--mf-warning, #d8a657);
      }
      .badge.revert {
        color: var(--mf-accent, #4c56c4);
      }
      .badge.undone {
        color: var(--mf-fg-dim, #8a8a96);
      }
      /* The watcher's revisions are not yours to undo: they stay legible but
         step back, so your own changes are what the eye lands on. */
      tr.rev.watcher-row td:not(:last-child) {
        color: var(--mf-fg-dim, #8a8a96);
      }
      tr.rev.undone-row td:first-child {
        text-decoration: line-through;
      }
      .head-marker {
        color: var(--mf-ok, #56c44c);
      }
      #watcher-toggle {
        margin-left: auto;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 4px;
        cursor: pointer;
      }
      .label {
        color: var(--mf-accent, #4c56c4);
      }
      .description {
        color: var(--mf-fg-dim, #8a8a96);
      }
      .placeholder {
        padding: 20px;
        text-align: center;
        color: var(--mf-fg-dim, #8a8a96);
      }
      /* An operation gone into: what it changed, field by field. Fixed
         columns, so the before and after line up. */
      #op-detail {
        padding: 8px;
      }
      #op-toolbar {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 4px;
      }
      .op-head {
        padding: 3px 8px;
        background: var(--mf-bg-raised, #26262e);
        font-family: var(--mf-font-mono, monospace);
        font-size: 0.9em;
      }
      .entity {
        padding: 3px 8px;
        color: var(--mf-fg-dim, #8a8a96);
      }
      a.ref-link {
        color: var(--mf-accent, #4c56c4);
        font-family: var(--mf-font-mono, monospace);
      }
      table.changes {
        table-layout: fixed;
      }
      table.changes th {
        position: static;
        background: none;
        color: var(--mf-fg-dim, #8a8a96);
        font-weight: normal;
        padding: 2px 8px;
      }
      table.changes th:first-child {
        width: 25%;
      }
      table.changes td {
        padding: 2px 8px;
        vertical-align: top;
        white-space: normal;
        word-break: break-word;
      }
      table.changes td.field {
        white-space: nowrap;
      }
      tr.unchanged td {
        color: var(--mf-fg-dim, #8a8a96);
      }
      tr.changed td.after,
      tr.added td.after {
        color: var(--mf-ok, #56c44c);
      }
      tr.changed td.before,
      tr.removed td.before {
        color: var(--mf-error, #e06c75);
        text-decoration: line-through;
      }
      .value + .value::before {
        content: ', ';
      }
      .absent {
        color: var(--mf-fg-dim, #8a8a96);
      }
      #status-line {
        padding: 3px 8px;
        background: var(--mf-bg-raised, #26262e);
        color: var(--mf-fg-dim, #8a8a96);
        font-size: 0.9em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="up" disabled title="Back out to the level above (cursor:parent, backspace)">↑ up</button>
      <button id="refresh">Refresh</button>
      <button id="undo" title="Undo a label of your last change still standing — the watcher's work is left in place (ctrl+z)">
        Undo (log:undo)
      </button>
      <button id="redo" title="Take back a label of the newest undo still standing (ctrl+shift+z)">
        Redo (log:redo)
      </button>
      <button id="revert" disabled title="Write the inverse of what is selected onto the current state, leaving the history in place (shift+r)">
        Revert selected (log:revert)
      </button>
      <button id="prune" disabled>Prune before selected (log:prune)</button>
      <label id="watcher-toggle" class="toggle" title="Show the labels the daemon wrote for the filesystem (log:toggle watcher, shift+w)"><input type="checkbox" id="show-watcher" checked />Watcher</label>
    </div>
    <div id="breadcrumb"></div>
    <div id="revisions">
      <p class="placeholder" id="placeholder">Loading…</p>
      <table hidden>
        <thead>
          <tr><th class="open-col"></th><th>label</th><th>newest</th><th>operations</th><th>status</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="op-detail" hidden>
        <div id="op-toolbar">
          <label class="toggle" title="Also list the fields the operation recorded but did not change (log:toggle unchanged)"
            ><input type="checkbox" id="unchanged" />Unchanged fields</label
          >
        </div>
        <div id="op-body"></div>
      </div>
      <div id="more" class="placeholder" hidden>
        <button id="show-more">Show older operations</button>
      </div>
    </div>
    <div id="status-line"></div>
  </body>
</html>
