<!doctype html>
<!-- Built-in panel type: the configuration files (doc "config panel"); the
     keys are edited in the keybindings panel. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>config</title>
    <style>
      [hidden] {
        display: none !important;
      }
      .mf-panel-body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 8px 12px;
        box-sizing: border-box;
        font-size: 13px;
        gap: 8px;
      }
      h2 {
        margin: 4px 0 0;
        font-size: 1em;
        color: var(--mf-fg-dim, #8a8a96);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #roots {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        color: var(--mf-fg-dim, #8a8a96);
      }
      #files-form {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #files-count {
        color: var(--mf-fg-dim, #8a8a96);
      }
      #files-block {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        border-top: 1px solid var(--mf-bg-raised, #26262e);
      }
      tr.category th {
        text-align: left;
        padding: 6px 8px 2px;
        color: var(--mf-fg-dim, #8a8a96);
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: var(--mf-bg, #1e1e24);
      }
      h2.with-action {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      h2 button {
        text-transform: none;
        letter-spacing: normal;
      }
      code,
      input:not([type]) {
        font-family: var(--mf-font-mono, monospace);
      }
      code {
        font-size: 0.9em;
        overflow-wrap: anywhere;
      }
      button {
        font: inherit;
        background: var(--mf-bg, #1e1e24);
        color: var(--mf-fg, #d8d8e0);
        border: 1px solid var(--mf-fg-dim, #8a8a96);
        border-radius: 3px;
        padding: 0 8px;
        cursor: pointer;
      }
      #file-filter {
        background: var(--mf-bg, #1e1e24);
        color: var(--mf-fg, #d8d8e0);
        border: 1px solid var(--mf-fg-dim, #8a8a96);
        border-radius: 3px;
        padding: 2px 6px;
        min-width: 0;
      }
      #file-filter {
        flex: 1;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 2px 8px;
        vertical-align: baseline;
      }
      tr:nth-child(odd) {
        background: var(--mf-bg-raised, #26262e);
      }
      .actions {
        white-space: nowrap;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h2 class="with-action">Files <button id="reload-all" title="config:reload all">Reload all</button></h2>
    <p id="roots"></p>
    <div id="files-form">
      <input id="file-filter" placeholder="filter (path)" autocomplete="off" />
      <span id="files-count"></span>
    </div>
    <div id="files-block">
      <table>
        <tbody id="files"></tbody>
      </table>
    </div>

  </body>
</html>
