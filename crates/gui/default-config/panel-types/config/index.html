<!doctype html>
<!-- Built-in panel type: the settings — where the configuration files are, and
     the keybinding editor (doc "config panel", doc "Changing keybindings"). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>config</title>
    <style>
      [hidden] {
        display: none !important;
      }
      .mf-panel-body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 8px 12px;
        box-sizing: border-box;
        font-size: 13px;
        gap: 8px;
      }
      h2 {
        margin: 4px 0 0;
        font-size: 1em;
        color: var(--mf-fg-dim, #8a8a96);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      #roots {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 4px 16px;
        color: var(--mf-fg-dim, #8a8a96);
      }
      #files-form {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #files-count {
        color: var(--mf-fg-dim, #8a8a96);
      }
      #files-block {
        max-height: 40%;
        flex-shrink: 0;
        overflow-y: auto;
        border-top: 1px solid var(--mf-bg-raised, #26262e);
      }
      tr.category th {
        text-align: left;
        padding: 6px 8px 2px;
        color: var(--mf-fg-dim, #8a8a96);
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: var(--mf-bg, #1e1e24);
      }
      h2.with-action {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      h2 button {
        text-transform: none;
        letter-spacing: normal;
      }
      code,
      .combo,
      input:not([type]) {
        font-family: var(--mf-font-mono, monospace);
      }
      code {
        font-size: 0.9em;
        overflow-wrap: anywhere;
      }
      button {
        font: inherit;
        background: var(--mf-bg, #1e1e24);
        color: var(--mf-fg, #d8d8e0);
        border: 1px solid var(--mf-fg-dim, #8a8a96);
        border-radius: 3px;
        padding: 0 8px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #form {
        display: grid;
        grid-template-columns: repeat(4, minmax(6em, 1fr)) auto auto;
        gap: 6px;
        align-items: center;
      }
      #form input:not([type]),
      #file-filter {
        background: var(--mf-bg, #1e1e24);
        color: var(--mf-fg, #d8d8e0);
        border: 1px solid var(--mf-fg-dim, #8a8a96);
        border-radius: 3px;
        padding: 2px 6px;
        min-width: 0;
      }
      #file-filter {
        flex: 1;
      }
      #form input.invalid {
        border-color: var(--mf-error, #c44c56);
      }
      label {
        white-space: nowrap;
      }
      #checks {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #checks p,
      #editing,
      #error {
        margin: 0;
      }
      .ok {
        color: var(--mf-fg-dim, #8a8a96);
      }
      .bad,
      #error {
        color: var(--mf-error, #c44c56);
      }
      #editing {
        color: var(--mf-accent, #4c56c4);
      }
      #count {
        color: var(--mf-fg-dim, #8a8a96);
      }
      #table {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        border-top: 1px solid var(--mf-bg-raised, #26262e);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 2px 8px;
        vertical-align: baseline;
      }
      tr:nth-child(odd) {
        background: var(--mf-bg-raised, #26262e);
      }
      tr.conflict {
        box-shadow: inset 3px 0 0 var(--mf-error, #c44c56);
      }
      tr.editing {
        box-shadow: inset 3px 0 0 var(--mf-accent, #4c56c4);
      }
      .combo {
        white-space: nowrap;
      }
      .label,
      .scope {
        color: var(--mf-fg-dim, #8a8a96);
      }
      .actions {
        white-space: nowrap;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h2 class="with-action">Files <button id="reload-all" title="config:reload all">Reload all</button></h2>
    <p id="roots"></p>
    <div id="files-form">
      <input id="file-filter" placeholder="filter (path)" autocomplete="off" />
      <span id="files-count"></span>
    </div>
    <div id="files-block">
      <table>
        <tbody id="files"></tbody>
      </table>
    </div>

    <h2 data-help-topic="settings">Keybindings</h2>
    <div id="form" data-help-topic="settings">
      <input id="combo" placeholder="key (ctrl+k, g g)" autocomplete="off" />
      <input id="command" placeholder="command" list="command-list" autocomplete="off" />
      <input id="when" placeholder="when (empty = global)" title="the panel type it applies in; empty = everywhere" list="when-list" autocomplete="off" />
      <input id="focus" placeholder="focus (empty = none)" title="the text field it applies in (@name); empty = none" list="focus-list" autocomplete="off" />
      <label><input id="text-input" type="checkbox" /> text-input</label>
      <span>
        <button id="save" disabled>Save</button>
        <button id="cancel">Clear</button>
      </span>
    </div>
    <datalist id="command-list"></datalist>
    <datalist id="when-list"></datalist>
    <datalist id="focus-list"></datalist>
    <p id="editing" hidden></p>
    <div id="checks">
      <p id="key-check"></p>
      <p id="command-check"></p>
      <p id="error"></p>
    </div>
    <span id="count"></span>
    <div id="table">
      <table>
        <tbody id="bindings"></tbody>
      </table>
    </div>
  </body>
</html>
