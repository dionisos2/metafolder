<!doctype html>
<!-- Help panel (doc "How the help panel finds a page"): the documentation wiki's
     static HTML pages (/docs/index.json) with a grep search box on top.
     Markup only — styles below, behaviour in main.js (export mount). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>help</title>
    <style>
      [hidden] {
        display: none !important;
      }
      .mf-panel-body {
        display: flex;
        flex-direction: column;
        height: 100%;
        box-sizing: border-box;
      }
      #help-search-row {
        flex: none;
        padding: 6px;
        border-bottom: 1px solid var(--mf-border, #34343e);
        background: var(--mf-bg-raised, #26262e);
      }
      #help-search {
        width: 100%;
        box-sizing: border-box;
        padding: 5px 7px;
        font-family: var(--mf-font-mono, monospace);
        color: var(--mf-fg, #d8d8e0);
        background: var(--mf-bg, #1e1e24);
        border: 1px solid var(--mf-border, #34343e);
        border-radius: 3px;
      }
      #help-options {
        margin-top: 4px;
        font-size: 0.8em;
        color: var(--mf-fg-dim, #8a8a96);
      }
      #help-warning {
        flex: none;
        padding: 5px 8px;
        font-size: 0.85em;
        color: var(--mf-warn-fg, #1e1e24);
        background: var(--mf-warn, #e0b050);
      }
      #help-title {
        font-size: 1.4em;
        margin: 0 0 6px;
      }
      #help-page-info {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 8px;
      }
      #help-page-info .page-tag,
      #help-page-info .page-badge {
        font: inherit;
        font-size: 0.8em;
        padding: 1px 8px;
        border-radius: 10px;
        border: 1px solid var(--mf-border, #34343e);
        background: var(--mf-bg-raised, #26262e);
        color: var(--mf-fg, #d8d8e0);
      }
      #help-page-info button.page-tag {
        cursor: pointer;
      }
      #help-page-info .page-badge {
        color: var(--mf-fg-dim, #8a8a96);
        font-style: italic;
      }
      /* The wiki renders every list item as a block, its text in a paragraph. */
      #help-content li > p {
        margin: 0;
      }
      #help-hint {
        margin-top: 4px;
        font-size: 0.8em;
        color: var(--mf-fg-dim, #8a8a96);
      }
      #help-hint-bar {
        margin-top: 4px;
        font-size: 0.8em;
        color: var(--mf-fg-dim, #8a8a96);
      }
      #help-hint-keys {
        width: 6em;
        font-family: var(--mf-font-mono, monospace);
        color: var(--mf-fg, #d8d8e0);
        background: var(--mf-bg, #1e1e24);
        border: 1px solid var(--mf-accent, #6ea8fe);
        border-radius: 3px;
      }
      /* The labels of the link hints, laid over the links. */
      #help-hints {
        position: absolute;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      #help-hints .link-hint {
        position: absolute;
        z-index: 1;
        transform: translate(-4px, -4px);
        padding: 0 3px;
        border-radius: 3px;
        font-family: var(--mf-font-mono, monospace);
        font-size: 0.85em;
        font-weight: bold;
        color: var(--mf-warn-fg, #1e1e24);
        background: var(--mf-warn, #e0b050);
        white-space: nowrap;
      }
      #help-hints .link-hint .typed {
        opacity: 0.45;
      }
      #help-scroll {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 10px 14px;
      }
      #help-results {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #help-results li {
        padding: 6px 8px;
        border-radius: 3px;
        cursor: pointer;
      }
      #help-results li:hover {
        background: var(--mf-bg-raised, #26262e);
      }
      #help-results .result-title {
        font-weight: bold;
      }
      #help-results .result-snippet {
        display: block;
        font-size: 0.85em;
        color: var(--mf-fg-dim, #8a8a96);
      }
      #help-content h1 {
        font-size: 1.4em;
        margin-top: 0;
      }
      #help-content h2 {
        font-size: 1.1em;
        margin-top: 1.2em;
      }
      #help-content h3 {
        font-size: 1em;
        margin-top: 1em;
        color: var(--mf-fg-dim, #8a8a96);
      }
      #help-content table {
        border-collapse: collapse;
        margin: 0.6em 0;
      }
      #help-content th,
      #help-content td {
        text-align: left;
        padding: 3px 12px 3px 0;
        border-bottom: 1px solid var(--mf-border, #33333d);
        vertical-align: top;
      }
      #help-content code {
        font-family: var(--mf-font-mono, monospace);
        background: var(--mf-bg-raised, #26262e);
        padding: 1px 4px;
        border-radius: 3px;
      }
      /* Key hints (`<span data-mf-key>` filled in from the live keybinding
         table): one <kbd> per combo, drawn as a key cap. */
      #help-content kbd {
        font-family: var(--mf-font-mono, monospace);
        background: var(--mf-bg-raised, #26262e);
        border: 1px solid var(--mf-border, #33333d);
        border-bottom-width: 2px;
        padding: 0 5px;
        border-radius: 4px;
        white-space: nowrap;
      }
      #help-content .unbound {
        color: var(--mf-fg-dim, #8a8a96);
        font-style: italic;
      }
      #help-content pre {
        font-family: var(--mf-font-mono, monospace);
        background: var(--mf-bg-raised, #26262e);
        padding: 8px 10px;
        border-radius: 3px;
        overflow-x: auto;
        white-space: pre-wrap;
      }
      #help-content a {
        color: var(--mf-accent, #6ea8fe);
        cursor: pointer;
      }
    </style>
  </head>
  <body data-help-topic="help panel">
    <div id="help-search-row">
      <input id="help-search" type="text" placeholder="search help (or a topic name; #text forces search)" />
      <div id="help-hint"></div>
      <div id="help-hint-bar" hidden>
        follow the link labelled
        <input id="help-hint-keys" type="text" data-mf-focus="hints" autocomplete="off" spellcheck="false" />
        — Escape cancels
      </div>
      <label id="help-options"><input id="help-dev" type="checkbox" /> include developer documentation in the search</label>
    </div>
    <div id="help-warning" hidden></div>
    <div id="help-scroll">
      <div id="help-hints"></div>
      <ul id="help-results" hidden></ul>
      <h1 id="help-title" hidden></h1>
      <div id="help-page-info" hidden></div>
      <div id="help-content"></div>
    </div>
  </body>
</html>
