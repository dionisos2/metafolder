<!doctype html>
<!-- Built-in panel type: the keybinding editor (doc "keybindings panel", doc
     "Changing keybindings") — the lines of keybindings.toml, the commands no
     key runs, filtered by class; the variables are a list apart. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>keybindings</title>
    <style>
      [hidden] {
        display: none !important;
      }
      .mf-panel-body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 8px 12px;
        box-sizing: border-box;
        font-size: 13px;
        gap: 8px;
      }
      code,
      kbd,
      input:not([type]) {
        font-family: var(--mf-font-mono, monospace);
      }
      button {
        font: inherit;
        background: var(--mf-bg, #1e1e24);
        color: var(--mf-fg, #d8d8e0);
        border: 1px solid var(--mf-fg-dim, #8a8a96);
        border-radius: 3px;
        padding: 0 8px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input:not([type]) {
        background: var(--mf-bg, #1e1e24);
        color: var(--mf-fg, #d8d8e0);
        border: 1px solid var(--mf-fg-dim, #8a8a96);
        border-radius: 3px;
        padding: 2px 6px;
        min-width: 0;
      }
      input.invalid {
        border-color: var(--mf-error, #c44c56);
      }
      #lists {
        display: flex;
        gap: 6px;
      }
      #lists button[aria-pressed='true'] {
        background: var(--mf-accent, #4c56c4);
      }
      #keys-view,
      #variables-view {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        gap: 8px;
      }
      #classes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      #classes button[aria-pressed='false'] {
        opacity: 0.4;
        text-decoration: line-through;
      }
      #count {
        color: var(--mf-fg-dim, #8a8a96);
        margin-left: auto;
      }
      #form {
        display: grid;
        grid-template-columns: minmax(8em, 1.2fr) minmax(8em, 1.6fr) repeat(3, minmax(5em, 1fr)) auto auto;
        gap: 6px;
        align-items: center;
      }
      label {
        white-space: nowrap;
      }
      #checks {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      #checks p {
        margin: 0;
      }
      .ok {
        color: var(--mf-fg-dim, #8a8a96);
      }
      .bad,
      #error {
        color: var(--mf-error, #c44c56);
      }
      #table {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        border-top: 1px solid var(--mf-bg-raised, #26262e);
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      td {
        padding: 2px 8px;
        vertical-align: baseline;
      }
      #bindings tr:nth-child(odd),
      #variables tr:nth-child(odd) {
        background: var(--mf-bg-raised, #26262e);
      }
      tr.conflict {
        box-shadow: inset 3px 0 0 var(--mf-error, #c44c56);
      }
      td.source input {
        /* --source-chars: the longest key written. 16px: padding and border. */
        width: calc(var(--source-chars, 16) * 1ch + 16px);
        box-sizing: border-box;
      }
      td.source input[readonly] {
        border-color: transparent;
      }
      .keys span {
        white-space: nowrap;
      }
      kbd {
        font-size: 0.95em;
        padding: 0 4px;
        border: 1px solid var(--mf-fg-dim, #8a8a96);
        border-radius: 3px;
      }
      .label,
      .scope,
      .none,
      .uses {
        color: var(--mf-fg-dim, #8a8a96);
      }
      .class {
        font-family: var(--mf-font-mono, monospace);
        font-weight: bold;
      }
      .actions {
        white-space: nowrap;
        text-align: right;
      }
      #variables-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      #variables-list table {
        width: auto;
      }
      #variable-check {
        margin: 4px 0 0;
      }
    </style>
  </head>
  <body>
    <div id="lists">
      <button id="show-keys" aria-pressed="true">Keybindings</button>
      <button id="show-variables" aria-pressed="false">Variables</button>
    </div>

    <div id="keys-view">
    <div id="classes" data-help-topic="command-classes">
      <span>Class</span>
      <button id="class-A" aria-pressed="true" title="used all the time: one key">A</button>
      <button id="class-B" aria-pressed="true" title="several times a session: a modifier, or two keys">B</button>
      <button id="class-C" aria-pressed="true" title="now and then: two or three keys">C</button>
      <button id="class-D" aria-pressed="true" title="rarely: the command input only">D</button>
      <button id="class-X" aria-pressed="true" title="cannot be undone: never a key">✕</button>
      <button id="class-none" aria-pressed="true" title="no class in command-classes.toml">?</button>
      <span id="count"></span>
    </div>

    <div id="form" data-help-topic="keybinding-editor">
      <input id="source" placeholder="key ({go} l, ctrl+k)" title="the key as the file writes it: {name} is a variable" autocomplete="off" />
      <input id="command" placeholder="command" list="command-list" autocomplete="off" />
      <input id="when" placeholder="when (empty = global)" title="the panel type it applies in; empty = everywhere" list="when-list" autocomplete="off" />
      <input id="focus" placeholder="focus (empty = none)" title="the text field it applies in (@name); empty = none" list="focus-list" autocomplete="off" />
      <input id="target" placeholder="target" title="for a command holding {target}: where its key aims, the variants i / b / n aim the others" list="target-list" autocomplete="off" />
      <label><input id="text-input" type="checkbox" /> text-input</label>
      <span>
        <button id="save" disabled>Save</button>
        <button id="clear">Clear</button>
      </span>
    </div>
    <datalist id="command-list"></datalist>
    <datalist id="when-list"></datalist>
    <datalist id="focus-list"></datalist>
    <datalist id="target-list">
      <option value="here"></option>
      <option value="other"></option>
      <option value="new"></option>
    </datalist>
    <div id="checks">
      <p id="key-check"></p>
      <p id="command-check"></p>
      <p id="error"></p>
    </div>

    <div id="table" data-help-topic="keybinding-editor">
      <table>
        <tbody id="bindings"></tbody>
      </table>
    </div>
    </div>

    <div id="variables-view" data-help-topic="keybinding-variables" hidden>
      <div id="variables-list">
        <table>
          <tbody id="variables"></tbody>
        </table>
      </div>
      <p id="variable-check"></p>
    </div>
  </body>
</html>
