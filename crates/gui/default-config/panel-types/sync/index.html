<!doctype html>
<!-- Built-in panel type: cross-repo synchronisation (spec-sync "GUI"). Pick the
     two repositories, review the sync status and the plan (grouped by op kind,
     with the live red/green overlay), edit conflict resolutions, and run. Drives
     the shared core::sync orchestration through metafolder.sync (no shell). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>sync</title>
    <style>
      .mf-panel-body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100%;
        font-size: 13px;
      }
      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
        padding: 6px 8px;
        background: var(--mf-bg-raised, #26262e);
        align-items: center;
      }
      #toolbar .pair {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #toolbar label {
        color: var(--mf-fg-dim, #8a8a96);
      }
      select,
      input,
      button {
        font: inherit;
        background: var(--mf-bg, #1e1e24);
        color: var(--mf-fg, #d8d8e0);
        border: 1px solid var(--mf-fg-dim, #8a8a96);
        border-radius: 3px;
        padding: 1px 6px;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #intents {
        flex: 1;
        min-width: 160px;
        font-family: var(--mf-font-mono, monospace);
      }
      #view {
        flex: 1;
        overflow-y: auto;
        padding: 4px 0;
      }
      .section-title {
        padding: 6px 10px 2px;
        color: var(--mf-fg-dim, #8a8a96);
        text-transform: uppercase;
        font-size: 0.8em;
        letter-spacing: 0.05em;
      }
      .row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 2px 10px;
        white-space: nowrap;
      }
      .row:hover {
        background: var(--mf-bg-raised, #26262e);
      }
      .flag {
        flex: none;
        font-family: var(--mf-font-mono, monospace);
        font-weight: 600;
      }
      .flag.green {
        color: var(--mf-ok, #4caf6a);
      }
      .flag.red {
        color: var(--mf-error, #d05a5a);
      }
      .kind {
        flex: none;
        font-weight: 600;
      }
      .count {
        flex: none;
        color: var(--mf-fg-dim, #8a8a96);
      }
      .ctx {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--mf-fg-dim, #8a8a96);
        font-family: var(--mf-font-mono, monospace);
        font-size: 0.9em;
      }
      .why {
        flex: none;
        color: var(--mf-error, #d05a5a);
        font-size: 0.9em;
      }
      .conflict {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 3px 10px;
        flex-wrap: wrap;
      }
      .conflict .field {
        font-weight: 600;
      }
      .conflict .val {
        font-family: var(--mf-font-mono, monospace);
        color: var(--mf-fg-dim, #8a8a96);
        max-width: 22ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .placeholder {
        padding: 20px;
        text-align: center;
        color: var(--mf-fg-dim, #8a8a96);
      }
      .warnings {
        padding: 2px 10px;
        color: var(--mf-error, #d05a5a);
        font-size: 0.9em;
      }
      #status-line {
        padding: 3px 10px;
        background: var(--mf-bg-raised, #26262e);
        color: var(--mf-fg-dim, #8a8a96);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <span class="pair">
        <label>A</label>
        <button id="repo-a" type="button"></button>
      </span>
      <span class="pair">
        <label>B</label>
        <button id="repo-b" type="button"></button>
      </span>
      <input id="intents" type="text" placeholder="path to intents.toml" />
      <button id="status-btn">Status</button>
      <button id="plan-btn">Plan</button>
      <button id="show-btn" disabled>Show</button>
      <button id="run-btn" disabled>Run</button>
    </div>
    <div id="view">
      <p class="placeholder">Pick two repositories, then Status or Plan.</p>
    </div>
    <div id="status-line"></div>
  </body>
</html>
