<!doctype html>
<!-- Built-in panel type: what the shell lines run in the workspace printed,
     read like a terminal (doc "shell panel"). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>shell</title>
    <style>
      [hidden] {
        display: none !important;
      }
      .mf-panel-body {
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100%;
        font-size: 13px;
      }
      #toolbar {
        padding: 4px 8px;
        background: var(--mf-bg-raised, #26262e);
      }
      button {
        font: inherit;
        background: var(--mf-bg, #1e1e24);
        color: var(--mf-fg, #d8d8e0);
        border: 1px solid var(--mf-fg-dim, #8a8a96);
        border-radius: 3px;
        padding: 1px 8px;
        cursor: pointer;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        margin: 0;
        padding: 6px 8px;
        font-family: var(--mf-font-mono, monospace);
        font-size: 0.9em;
      }
      #empty {
        color: var(--mf-fg-dim, #8a8a96);
      }
      .run + .run {
        margin-top: 8px;
      }
      .head {
        display: flex;
        gap: 8px;
      }
      .command {
        flex: 1;
        font-weight: bold;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .command::before {
        content: '$ ';
        color: var(--mf-fg-dim, #8a8a96);
      }
      .ts {
        color: var(--mf-fg-dim, #8a8a96);
      }
      .out {
        white-space: pre-wrap;
        word-break: break-all;
      }
      .stderr {
        color: var(--mf-error, #e06c75);
      }
      /* What the user typed to the line, as a terminal echoes it. */
      .input {
        color: var(--mf-accent, #3d5a80);
      }
      .status {
        color: var(--mf-fg-dim, #8a8a96);
        font-style: italic;
      }
      .status[data-failed] {
        color: var(--mf-error, #e06c75);
      }
      .status::before {
        content: '[';
      }
      .status::after {
        content: ']';
      }
      #candidates {
        padding: 2px 8px;
        font-family: var(--mf-font-mono, monospace);
        font-size: 0.9em;
        color: var(--mf-fg-dim, #8a8a96);
        white-space: pre-wrap;
        word-break: break-all;
      }
      #prompt {
        padding: 4px 8px;
        border-top: 1px solid var(--mf-border, #3a3a44);
        font-family: var(--mf-font-mono, monospace);
        font-size: 0.9em;
      }
      #entry {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #cwd {
        /* On a line of its own above the input, which keeps the whole width.
           A long path keeps its end, the part that says where you are. */
        margin-bottom: 2px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        direction: rtl;
        /* rtl would push a path that fits to the right. */
        text-align: left;
        color: var(--mf-accent, #3d5a80);
      }
      #sigil {
        color: var(--mf-fg-dim, #8a8a96);
      }
      #line {
        flex: 1;
        min-width: 0;
        font: inherit;
        background: var(--mf-bg, #1e1e24);
        color: var(--mf-fg, #d8d8e0);
        border: 1px solid var(--mf-border, #3a3a44);
        border-radius: 3px;
        padding: 2px 6px;
        outline: none;
      }
      #line:focus {
        border-color: var(--mf-accent, #3d5a80);
      }
    </style>
  </head>
  <body>
    <div id="toolbar"><button id="clear">Clear (shell:clear)</button></div>
    <div id="log"><div id="empty">No shell line run yet: type one below, or ! in the command input.</div></div>
    <div id="candidates" hidden></div>
    <div id="prompt">
      <div id="cwd" hidden></div>
      <div id="entry">
        <span id="sigil">$</span>
        <input id="line" type="text" spellcheck="false" autocomplete="off" aria-label="Shell line" placeholder="a shell line — Enter runs it (or answers the one running), Tab completes" />
      </div>
    </div>
  </body>
</html>
