# The class of every command (doc "Command classes"): how often it is used,
# which decides what key it may have (doc "Choosing keybindings").
#
#   A  all the time              one key
#   B  several times a session   one modifier, or two keys
#   C  now and then              two or three keys
#   D  rarely                    the command input only
#   X  cannot be undone          never a key
#
# A key is a command, or an invocation's first words: "log:revert" classes
# every revert, "log:revert op" that one only — the longest that fits wins.
# The keybindings panel filters its list by class.

