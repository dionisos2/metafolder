[package]
name = "metafolder-gui"
version = "0.3.0"
edition = "2021"
publish = false

[lib]
name = "metafolder_gui"

[[bin]]
name = "metafolder-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
metafolder-core = { path = "../core", features = ["git"] }
# Content-based file type detection (magic bytes, pure Rust): the detector
# behind the daemon's `mfr_mime`, so the previews agree with the repository.
infer = "0.22"
# devtools: the WebKit inspector stays available in release builds via
# the devtools:open command (the native context menu is disabled).
tauri = { version = "2", features = ["devtools"] }
tokio = { version = "1", features = ["full"] }
# axum 0.7 to match the daemon (same router/test patterns).
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# Blocking daemon client for the cross-repo sync orchestration
# (`metafolder_core::sync`), run under `spawn_blocking` — the async reqwest
# proxy cannot drive core's synchronous orchestration.
ureq = { version = "3", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.0"
# Editing keybindings.toml in place: the file keeps its comments and layout.
toml_edit = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }
clap = { version = "4", features = ["derive"] }
# The navigation gate parses URLs rather than prefix-matching them (sandbox.rs).
url = "2"
# The desktop's trash (freedesktop.org specification) for a path no repository
# holds (doc "Trash"). `chrono` writes the DeletionDate the specification
# requires; the other default features are Windows COM settings.
trash = { version = "5", default-features = false, features = ["chrono"] }

# Already in the dependency tree via wry; used directly to react to
# WebKit web-process crashes (reload instead of a frozen window).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_32"] }

# The calls between fork and exec (sandbox.rs, shell_session.rs), which run in
# an `unsafe` pre_exec hook whatever they call; every other system call goes
# through rustix, which wraps it safely.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[lints]
workspace = true
