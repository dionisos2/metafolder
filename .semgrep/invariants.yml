# Project invariants that neither rustc nor clippy can see (CLAUDE.md "Key
# invariants", docs/spec-*.org). Run with:
#
#   semgrep scan --config .semgrep/invariants.yml
#
# Each rule is a regression guard: the codebase satisfies all of them today.

rules:
  - id: mf-write-outside-writer
    languages: [rust]
    severity: ERROR
    message: >-
      Direct SQL write to a data table. Every write must go through
      `log::Writer`, which is what keeps the event log, HEAD and the data
      tables mutually consistent in a single transaction. Add an operation
      type to log.rs instead.
    paths:
      include:
        - crates/daemon/src/**
      exclude:
        - crates/daemon/src/log.rs
        - crates/daemon/src/db.rs
    patterns:
      - pattern-either:
          - pattern: $C.execute($SQL, ...)
          - pattern: $C.execute_batch($SQL)
      # `UPDATE revision SET label` is deliberately not matched: labelling a
      # revision annotates the log, it does not change data, so it produces no
      # operation. Creating or removing a revision outside the Writer would.
      - metavariable-regex:
          metavariable: $SQL
          regex: (?i).*((insert\s+into|update|delete\s+from)\s+(field|metarecord|metarecord_db|operation|op_snapshot|log_head)|(insert\s+into|delete\s+from)\s+revision)\b.*

  - id: mf-writer-bypasses-retention
    languages: [rust]
    severity: ERROR
    message: >-
      `Writer::begin` keeps the whole history whatever the configuration says.
      A write on a loaded repository must go through `RepoState::writer` (or
      carry a `Retention` explicitly), or the repository's configured log
      retention silently does not apply to it — spec-event-log "Automatic
      retention". `repo.rs` is the one exception: it writes the root metarecord
      of a repository that does not exist yet.
    paths:
      include:
        - crates/daemon/src/**
      exclude:
        - crates/daemon/src/repo.rs
        - crates/daemon/src/log.rs
    patterns:
      - pattern: Writer::begin($C, $L)
      - pattern-not-inside: mod tests { ... }

  - id: mf-mfr-path-nothing-outside-watcher
    languages: [rust]
    severity: ERROR
    message: >-
      Only the watcher (executor.rs), the orphan sweep (orphans.rs) and manual
      `force` writes may set `mfr_path` to Nothing — reconcile leaves stale
      TreeRefs in place (spec-file-tracking). Writing Nothing here would erase a
      path on a file that merely became ineligible.
    paths:
      include:
        - crates/daemon/src/**
      exclude:
        # The two deliberate writers of Nothing. The watcher clears the path of a
        # file it saw disappear; `mf orphan clear` does the same on demand for
        # the ones it did not see go (a path present but no file behind it) —
        # that write *is* the feature. What the rule guards against is reconcile,
        # or any new caller, doing it silently.
        - crates/daemon/src/executor.rs
        - crates/daemon/src/orphans.rs
    pattern-either:
      - pattern: $W.set_field_as($OP, $E, "mfr_path", Value::Nothing)
      - pattern: $W.set_field($E, "mfr_path", Value::Nothing)

  - id: mf-repostate-arc-in-background-task
    languages: [rust]
    severity: ERROR
    message: >-
      The watcher and executor must hold a `Weak<RepoState>`, never an Arc:
      an Arc would keep the repo — and its exclusive SQLite lock — alive
      forever, so the repo could never be unloaded. Use `Arc::downgrade` and
      `upgrade()` at each tick.
    paths:
      include:
        - crates/daemon/src/watcher.rs
        - crates/daemon/src/executor.rs
    # Only `Arc::clone`: a background task can only get a second owning handle on
    # an *existing* `Arc<RepoState>` by cloning it. `Arc::new` was matched here
    # too, but it constructs a fresh value — it flagged the watcher's own
    # `Arc::new(WatcherInner { .. })`, which owns no repository.
    pattern: Arc::clone($REPO)

  - id: mf-unsandboxed-decoder
    languages: [rust]
    severity: ERROR
    message: >-
      Media decoders face untrusted files and must be confined: build a
      `sandbox::Spec` (bwrap + rlimits, fail closed) instead of spawning the
      program directly (spec-gui "Untrusted media").
    paths:
      include:
        - crates/gui/src/**
    patterns:
      - pattern-either:
          - pattern: Command::new($PROG)
          - pattern: std::process::Command::new($PROG)
      - metavariable-regex:
          metavariable: $PROG
          regex: .*(ffmpeg|ffprobe|gst-discoverer|gst-launch).*
      # Tests may drive ffmpeg directly: they *generate* synthetic clips
      # (`-f lavfi -i testsrc`), so no untrusted file is ever decoded. Matched
      # by module name — semgrep does not see the `#[cfg(test)]` attribute.
      - pattern-not-inside: mod tests { ... }

  - id: mf-panel-queries-document
    languages: [javascript]
    severity: ERROR
    message: >-
      Panels run in the shell's JS realm and are mounted in a Shadow DOM root:
      `document` is the shell, not the panel. Query `root` instead
      (`root.getElementById(...)`), or the panel will silently find the
      shell's nodes — or nothing at all.
    paths:
      include:
        - crates/gui/default-config/panel-types/**
    pattern-either:
      - pattern: document.getElementById(...)
      - pattern: document.querySelector(...)
      - pattern: document.querySelectorAll(...)

  - id: mf-typecheck-suppressed-in-gui-js
    languages: [generic]
    severity: ERROR
    message: >-
      The GUI's JS is fully typechecked (`checkJs`, no exceptions): the shim and
      every panel are in the tsc program, and `npm run typecheck` is the only
      thing standing between a typo in a panel and a broken mount at runtime.
      A suppression comment silently takes a file back out of that program.
      Fix the type, or name the shape the value really has.
    paths:
      include:
        - crates/gui/panel-shim/**
        - crates/gui/default-config/panel-types/**
    pattern-regex: '@ts-(nocheck|ignore|expect-error)'

  - id: mf-simplified-query-read-as-dsl
    languages: [javascript]
    severity: ERROR
    message: >-
      `metarecord-list:query` holds the *simplified* query text. Handing it to
      the normal DSL parser is a bug that does not announce itself: `#jazz`
      either fails to parse or means something else entirely, so a panel acting
      on "the current query" targets a set the user never asked for. Read
      `metarecord-list:effective-query` (the IR the list actually runs, finder
      narrowing included) or `metarecord-list:base-query-text` (the same base
      query already expanded to normal DSL). The list panel itself owns the
      simplified text and is exempt.
    paths:
      include:
        - crates/gui/default-config/panel-types/**
      exclude:
        - crates/gui/default-config/panel-types/metarecord-list/**
    pattern: $W.get('metarecord-list:query')

  - id: mf-path-exists-follows-symlinks
    languages: [rust]
    severity: ERROR
    message: >-
      `Path::exists()` follows symlinks, so a *broken* symlink reads as
      absent — but it is an ordinary tracked file: the reconcile walk stats
      it with `symlink_metadata` and records its target, and a user can move it
      and lose it. Believing `exists()` here reported a present file as an
      orphan, skipped its re-stat, left it behind on a rollback, and let a
      rename destroy it instead of trashing it first. Ask about the entry
      itself: `metafolder_core::fsentry::path_present` (and `is_real_dir`
      wherever `Path::is_dir()`, which follows links too, asks the same
      question).
    paths:
      include:
        - crates/daemon/src/reconcile.rs
        - crates/daemon/src/orphans.rs
        - crates/daemon/src/watcher.rs
        - crates/daemon/src/executor.rs
        - crates/core/src/trash.rs
        - crates/core/src/sync/run.rs
        - crates/cli/src/log.rs
      exclude:
        - "**/tests/**"
    # Only `.exists()`: it is unambiguous (a `Metadata` has no such method), so
    # every hit is a path question. `is_dir()` cannot be matched the same way —
    # the correct `metadata.is_dir()` / `file_type().is_dir()` calls are spelt
    # identically and would drown the rule in false positives.
    patterns:
      - pattern: $P.exists()
      # The inline `mod tests` of these files asserts on disposable fixtures it
      # created itself, where following a link is not a question.
      - pattern-not-inside: |
          mod tests { ... }
