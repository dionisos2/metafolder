[workspace]
members = [
    "crates/core",
    "crates/daemon",
    "crates/cli",
    "crates/gui",
    "crates/bench",
    "crates/query-oracle",
    "crates/watchd",
]
resolver = "2"

# Every unsafe block says why it is sound (`// SAFETY:` just above it); see
# doc "Unsafe code". Every member opts in with `[lints] workspace = true`,
# but watchd, whose blocks are not documented yet.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Keep target/ small: full debug info (the default) duplicates gigabytes of
# DWARF into every test binary. Line tables keep backtraces readable.
[profile.dev]
debug = "line-tables-only"

# External dependencies: no debug info at all (workspace members keep theirs).
[profile.dev.package."*"]
debug = false
